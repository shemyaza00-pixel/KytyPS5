name: Fritchii v4.1 + PR251 - Clang PGO Windows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-fritchii-v4.1-pr251-pgo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pgo:
    name: Fritchii-v4.1-PR251-PGO-Windows-x64
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        working-directory: emulator
    steps:
      - name: Check out Fritchii v4.1
        uses: actions/checkout@v4
        with:
          repository: Frizti/Fritchii
          ref: fritchii-v4.1
          path: emulator
          persist-credentials: false

      - name: Apply OoT movie audio/video fix (Lichii PR251)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $patch = Join-Path $env:RUNNER_TEMP 'oot-movie-clock-pr251.diff'
          Invoke-WebRequest -Uri 'https://github.com/zortos293/Lichii/pull/251.diff' -OutFile $patch
          if (!(Test-Path $patch)) { throw 'Patch download failed' }
          git apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'PR251 cannot be applied to v4.1' }
          git apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'PR251 apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace/error check failed' }
          if (!(Select-String -Path 'src/core/hle/service/nx2_gsv.h' -Pattern 'OcarinaOfTimeMovieProgramId' -Quiet)) {
            throw 'PR251 signature absent'
          }

      - name: Verify Fritchii PGO training profile
        shell: pwsh
        run: |
          if (!(Test-Path 'eglantine.profdata')) { throw 'Required Fritchii PGO profile missing' }
          if ((Get-Item 'eglantine.profdata').Length -lt 1000000) {
            throw 'Fritchii PGO profile unexpectedly small'
          }

      # Exactly the MinGW/UCRT64 compiler and deps used by Fritchii's official Windows PGO workflow.
      - name: Set up MSYS2 Clang and libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            git make autoconf libtool automake-wrapper patch jq pactoys ninja
          pacboy: >-
            toolchain:p clang:p lld:p cmake:p python-pip:p
            qt6-base:p qt6-charts:p qt6-tools:p qt6-translations:p qt6-svg:p
            openssl:p boost:p fmt:p lz4:p nlohmann-json:p zlib:p zstd:p libiconv:p
            vulkan-memory-allocator:p vulkan-devel:p glslang:p enet:p opus:p
            libusb:p unordered_dense:p jbigkit:p xz:p libdeflate:p bzip2:p
            lerc:p graphite2:p libwebp:p libtiff:p brotli:p ccache:p

      - name: Configure Release with Fritchii PGO profile
        shell: msys2 {0}
        run: |
          set -euo pipefail
          clang --version
          profile="-fprofile-use=$(cygpath -m "$PWD/eglantine.profdata") -Wno-backend-plugin -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DYUZU_TESTS=OFF \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DLICHII_BUILD_TAG=PR251-OOT-PGO \
            -DLICHII_BUILD_PLATFORM=windows-x86_64-pgo \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            "-DCMAKE_C_FLAGS=$profile" \
            "-DCMAKE_CXX_FLAGS=$profile"

      - name: Compile Windows x64 with Clang PGO
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build/release --target yuzu yuzu-cmd --parallel 2

      # MinGW requires all non-system DLLs alongside the EXEs.
      - name: Bundle MinGW DLLs and Qt plugins
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/ucrt64/bin:$PATH"
          cd build/release/bin
          test -f lichii.exe
          test -f eden-cli.exe
          windeployqt6 --no-translations --no-compiler-runtime --no-opengl-sw \
            --no-system-dxc-compiler --no-system-d3d-compiler lichii.exe
          deps() {
            objdump -p "$1" | awk '/DLL Name:/ {print $3}' | while read -r dll; do
              [ -z "$dll" ] && continue
              source=$(command -v "$dll" 2>/dev/null || true)
              [ -z "$source" ] && continue
              case "$source" in
                *System32* | *SysWOW64*) continue ;;
              esac
              if [ ! -f "$dll" ]; then
                cp "$source" "$dll"
                deps "$source"
              fi
            done
          }
          for exe in lichii.exe eden-cli.exe; do deps "$exe"; done
          find . -name '*.dll' | while read -r dll; do deps "$dll"; done

      - name: Describe custom build
        shell: pwsh
        run: |
          @'
          Experimental Fritchii v4.1, Windows x64 Clang/MinGW Release with PGO
          Base: https://github.com/Frizti/Fritchii/releases/tag/fritchii-v4.1
          PGO profile: Fritchii's bundled eglantine.profdata
          Extra patch: https://github.com/zortos293/Lichii/pull/251
          Corrects pre-rendered OoT video/audio timing, not general in-game audio.
          No game-performance gain is guaranteed; compare to non-PGO build in the same scene.
          '@ | Set-Content -Encoding UTF8 'build/release/bin/PR251-PGO-BUILD-INFO.txt'

      - name: Upload portable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Fritchii-v4.1-PR251-PGO-Windows-x64
          path: emulator/build/release/bin/
          if-no-files-found: error
          retention-days: 14
