name: Astro Bot Optimized V2 Windows build

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout known-working Astro base
        uses: actions/checkout@v4
        with:
          repository: itsmemac/KytyPS5
          ref: spiderman-running-22-09-2026
          submodules: recursive
          fetch-depth: 0

      - name: Apply compatibility, audio, shader and cache fixes
        shell: pwsh
        run: |
          git config user.name "AstroBot CI"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/KytyPS5/KytyPS5.git

          git fetch upstream refs/pull/838/head:pr838
          git fetch upstream 8c4224908b758abd91cf3a3f36fbe1be1b2f5e0a
          git fetch upstream refs/pull/985/head:pr985
          git fetch upstream e317465d8a773b33482ad367ad2f856154c8bc6d
          git fetch upstream d9f34f90caafe810e2caedde6a9ac9673a5b208d
          git fetch upstream 37c8482d4ed87bf8a3540217d0ec42f50ef7a4d1
          git fetch upstream 8fa116eeb157964ea3b7aec1eed4d6e9d87e11de
          git fetch upstream 0bb2bdad17f69c3adc50934da88319826ae6adf5
          git fetch upstream 0ce84e59b66f788108280d450ee7d66b834d0949
          git fetch upstream 96011cc5c96d9d8390b2aa3413d3686dc5519372

          git cherry-pick pr838
          if ($LASTEXITCODE -ne 0) { throw "Cherry-pick #838 failed" }

          git cherry-pick 8c4224908b758abd91cf3a3f36fbe1be1b2f5e0a
          if ($LASTEXITCODE -ne 0) { throw "Cherry-pick compatible #839 failed" }

          # #985: known to require only test conflict resolution on this base.
          $commits985 = git rev-list --reverse e317465d8a773b33482ad367ad2f856154c8bc6d..pr985
          foreach ($commit in $commits985) {
            git cherry-pick $commit
            if ($LASTEXITCODE -ne 0) {
              $unmerged = @(git diff --name-only --diff-filter=U)
              if ($unmerged.Count -gt 0 -and ($unmerged | Where-Object { $_ -notlike "tests/*" }).Count -eq 0) {
                foreach ($file in $unmerged) {
                  git checkout --theirs -- $file
                  git add $file
                }
                git -c core.editor=true cherry-pick --continue
                if ($LASTEXITCODE -ne 0) { throw "Could not continue #985 at $commit" }
              } else {
                $unmerged | ForEach-Object { Write-Host "Unresolved: $_" }
                throw "Cherry-pick #985 failed at $commit"
              }
            }
          }

          # The #780 integration branch already carries the #822 cadence work and the
          # #848 shared AvPlayer audio-master clock. #966 is ported below because its
          # newer audio.cpp also contains unrelated controller changes.

          # #985 already contains #801 and mainline optimizations 64eea6b + 684330c.
          # The old PR #558 DPP-helper patch targets a different ballot implementation; #985
          # no longer masks helper invocations in that path, so applying it would be wrong.

          # Astro-specific streamed mip residency fix. This directly targets the type of
          # texture corruption seen in gameplay.
          git cherry-pick d9f34f90caafe810e2caedde6a9ac9673a5b208d
          if ($LASTEXITCODE -ne 0) {
            $unmerged = @(git diff --name-only --diff-filter=U)
            $unmerged | ForEach-Object { Write-Host "Unresolved streamed-mip fix: $_" }
            throw "Streamed-mip rendering fix failed"
          }

          # Fix mismatched depth/colour attachment extents observed in Astro.
          git cherry-pick 37c8482d4ed87bf8a3540217d0ec42f50ef7a4d1
          if ($LASTEXITCODE -ne 0) {
            $unmerged = @(git diff --name-only --diff-filter=U)
            $unmerged | ForEach-Object { Write-Host "Unresolved depth-target fix: $_" }
            throw "Depth-target rendering fix failed"
          }

          # Performance commits not already in #985 ancestry.
          foreach ($commit in @(
            "8fa116eeb157964ea3b7aec1eed4d6e9d87e11de",
            "0bb2bdad17f69c3adc50934da88319826ae6adf5",
            "0ce84e59b66f788108280d450ee7d66b834d0949",
            "96011cc5c96d9d8390b2aa3413d3686dc5519372"
          )) {
            git cherry-pick $commit
            if ($LASTEXITCODE -ne 0) {
              $unmerged = @(git diff --name-only --diff-filter=U)
              $unmerged | ForEach-Object { Write-Host "Unresolved perf fix: $_" }
              throw "Performance cherry-pick failed at $commit"
            }
          }

          # #988's current head rewrites the newer pipeline-cache architecture and is not
          # directly cherry-pickable onto #780. #982 remains enabled for persistent Vulkan cache.

          $markers = git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.cpp' '*.h' 2>$null
          if ($LASTEXITCODE -eq 0 -and $markers) {
            $markers
            throw "Conflict markers remain"
          }

          git log -15 --oneline

      - name: Port latest AudioOut clock fix (#966)
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path("src/libs/audio.cpp")
          s = p.read_text(encoding="utf-8")

          def once(old, new, label):
              global s
              if old not in s:
                  raise RuntimeError(f"{label}: source text not found")
              s = s.replace(old, new, 1)

          if "#include <array>" not in s:
              once("#include <algorithm>\n", "#include <algorithm>\n#include <array>\n", "array include")

          if "struct OutputClock" not in s:
              once(
                  "constexpr uint32_t AUDIO_IN_GRAIN_MAX_ASYNC          = 384;\n",
                  """constexpr uint32_t AUDIO_IN_GRAIN_MAX_ASYNC          = 384;

          struct OutputClock {
              uint64_t next_time = 0;
              uint64_t remainder = 0;

              uint64_t Advance(uint64_t now, uint32_t frames, uint32_t rate) {
                  if (next_time == 0 || (now > next_time && now - next_time > 100000)) {
                      next_time = now;
                      remainder = 0;
                  }
                  const auto deadline = next_time;
                  const auto duration = 1000000ULL * frames + remainder;
                  next_time += duration / rate;
                  remainder = duration % rate;
                  return deadline;
              }
          };
          """,
                  "OutputClock",
              )

          once(
              """\t\tbool     used             = false;
          \t\tint      type             = 0;
          \t\tuint32_t samples_num      = 0;
          \t\tuint32_t freq             = 0;
          \t\tFormat   format           = Format::Unknown;
          \t\tuint64_t last_output_time = 0;
          \t\tbool     queue_primed     = false;
          \t\tint      channels_num     = 0;""",
              """\t\tbool        used         = false;
          \t\tint         type         = 0;
          \t\tuint32_t    samples_num  = 0;
          \t\tuint32_t    freq         = 0;
          \t\tFormat      format       = Format::Unknown;
          \t\tOutputClock clock;
          \t\tbool        queue_primed = false;
          \t\tint         channels_num = 0;""",
              "PortOut clock",
          )

          once(
              """\t\tauto queued                = SDL_GetAudioStreamQueued(port->stream);
          \t\tif (queued < static_cast<int>(prepared_size)) {
          \t\t\tport->queue_primed = false;
          \t\t}
          \t\twhile (queued > static_cast<int>(min_queued_size)) {""",
              """\t\tauto queued                = SDL_GetAudioStreamQueued(port->stream);
          \t\twhile (queued > static_cast<int>(min_queued_size)) {""",
              "queue precheck",
          )

          once(
              """\tif (!SDL_PutAudioStreamData(port->stream, prepared_data, static_cast<int>(prepared_size))) {
          \t\tLOGF("AudioOut: SDL_PutAudioStreamData failed: %s\\n", SDL_GetError());
          \t\treturn false;
          \t}
          \tif (blocking && !port->queue_primed &&
          \t    SDL_GetAudioStreamQueued(port->stream) >= static_cast<int>(min_queued_size)) {
          \t\tport->queue_primed = true;
          \t}""",
              """\tif (!SDL_PutAudioStreamData(port->stream, prepared_data, static_cast<int>(prepared_size))) {
          \t\tLOGF("AudioOut: SDL_PutAudioStreamData failed: %s\\n", SDL_GetError());
          \t\tport->queue_primed = false;
          \t\treturn false;
          \t}
          \tif (!port->queue_primed) {
          \t\tport->clock = {};
          \t}
          \tif (blocking && !port->queue_primed &&
          \t    SDL_GetAudioStreamQueued(port->stream) >= static_cast<int>(min_queued_size)) {
          \t\tport->queue_primed = true;
          \t}""",
              "queue clock reset",
          )

          once(
              """\t\t\tport.used             = true;
          \t\t\tport.type             = type;
          \t\t\tport.samples_num      = samples_num;
          \t\t\tport.freq             = freq;
          \t\t\tport.format           = format;
          \t\t\tport.last_output_time = 0;""",
              """\t\t\tport.used        = true;
          \t\t\tport.type        = type;
          \t\t\tport.samples_num = samples_num;
          \t\t\tport.freq        = freq;
          \t\t\tport.format      = format;""",
              "open clock",
          )

          start = s.index("uint32_t Audio::AudioOutOutputs(OutputParam* params, uint32_t num, bool blocking) {")
          end = s.index("\nstatic bool RecordingDevicePresent", start)
          replacement = """uint32_t Audio::AudioOutOutputs(OutputParam* params, uint32_t num, bool blocking) {
          \tEXIT_NOT_IMPLEMENTED(num == 0 || num > OUT_PORTS_MAX);
          \tEXIT_NOT_IMPLEMENTED(!AudioOutValid(params[0].handle));

          \tconst auto&                     first_port = m_out_ports[params[0].handle.GetId()];
          \tstd::array<bool, OUT_PORTS_MAX> paced {};
          \tbool                            any_device = false;
          \tuint64_t                        deadline   = 0;

          \tfor (uint32_t i = 0; i < num; i++) {
          \t\tauto& port = m_out_ports[params[i].handle.GetId()];

          \t\tuint64_t controller_queued_us = 0;
          \t\tif (port.haptics != nullptr) {
          \t\t\tCommon::LockGuard lock(m_mutex);
          \t\t\tcontroller_queued_us = Controller::DualSenseHaptics::Queue(
          \t\t\t    port.haptics, Controller::GetActiveControllerId(), params[i].data,
          \t\t\t    port.samples_num, static_cast<uint32_t>(port.channels_num),
          \t\t\t    FormatIsFloat(port.format), port.volume);
          \t\t}
          \t\tif (controller_queued_us == 0) {
          \t\t\tif (QueueSdlAudio(&port, params[i].data, blocking)) {
          \t\t\t\tany_device = true;
          \t\t\t\tpaced[i]   = port.queue_primed;
          \t\t\t}
          \t\t} else {
          \t\t\tport.queue_primed = false;
          \t\t\tif (port.type == AUDIO_OUT_PORT_TYPE_PADSPK) {
          \t\t\t\tany_device = true;
          \t\t\t\tif (blocking && controller_queued_us > AUDIO_OUT_TARGET_LATENCY_US) {
          \t\t\t\t\tdeadline = std::max(deadline, LibKernel::KernelGetProcessTime() +
          \t\t\t\t\t                                   controller_queued_us -
          \t\t\t\t\t                                   AUDIO_OUT_TARGET_LATENCY_US);
          \t\t\t\t}
          \t\t\t}
          \t\t}
          \t}

          \tconst auto now = LibKernel::KernelGetProcessTime();
          \tfor (uint32_t i = 0; i < num; i++) {
          \t\tauto& port = m_out_ports[params[i].handle.GetId()];
          \t\tif (blocking && (paced[i] || !any_device)) {
          \t\t\tdeadline = std::max(deadline, port.clock.Advance(now, port.samples_num, port.freq));
          \t\t} else {
          \t\t\tport.clock = {};
          \t\t}
          \t\tif (!blocking) {
          \t\t\tport.queue_primed = false;
          \t\t}
          \t}
          \tif (deadline > now) {
          \t\tCommon::Thread::SleepMicro(deadline - now);
          \t}

          \treturn first_port.samples_num;
          }
          """
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding="utf-8")
          '@ | Set-Content -Encoding UTF8 .port_audio966.py

          python .port_audio966.py
          if ($LASTEXITCODE -ne 0) { throw "Failed to port #966 audio timing" }
          Remove-Item .port_audio966.py
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "#966 port has whitespace errors" }

      - name: Port Astro streamed-mip residency fix
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding="utf-8")

          def save(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def sub_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise RuntimeError(f"{label}: expected one match, got {n}")
              return out

          # ImageInfo: remember the first resident mip.
          path = "src/graphics/host_gpu/renderer/image/imageInfo.h"
          s = load(path)
          if "resident_base_level" not in s:
              s = sub_once(
                  s,
                  r"(\bImageSubresources\s+resources;\s*\n)",
                  r"\1\tuint32_t                     resident_base_level = 0;\n",
                  "ImageInfo resident_base_level",
              )
              save(path, s)

          # Tile helper: allow the transfer to begin at a later mip.
          path = "src/graphics/host_gpu/renderer/image/textureCommon.h"
          s = load(path)
          if "uint32_t base_level = 0" not in s:
              s = sub_once(
                  s,
                  r"(bool TextureBuildGpuTileInfos\([^;]*?uint32_t levels,\s*\n\s*std::vector<GpuTileInfo>& out_tile_infos)\);",
                  r"\1,\n                              uint32_t base_level = 0);",
                  "TextureBuildGpuTileInfos declaration",
                  re.S,
              )
              save(path, s)

          path = "src/graphics/host_gpu/renderer/image/textureCommon.cpp"
          s = load(path)
          if "uint32_t base_level)" not in s[s.find("bool TextureBuildGpuTileInfos"):s.find("bool TextureBuildGpuTileInfos")+500]:
              s = sub_once(
                  s,
                  r"(bool TextureBuildGpuTileInfos\(uint64_t tiled_size, const std::vector<vk::BufferImageCopy>& regions,\s*\n\s*const TextureUploadLayout& layout, uint32_t levels,\s*\n\s*std::vector<GpuTileInfo>& out_tile_infos)\) \{",
                  r"\1, uint32_t base_level) {",
                  "TextureBuildGpuTileInfos definition",
                  re.S,
              )
              s = sub_once(
                  s,
                  r"if \(tiled_size == 0 \|\| levels == 0 \|\| levels > 16 \|\| depth == 0 \|\|\s*\n\s*regions\.size\(\) != GetTextureRegionCount\(depth, levels, volume_texture\) \|\|",
                  "const auto expected_regions = GetTextureRegionCount(depth, levels, volume_texture) -\n"
                  "\t                              GetTextureRegionCount(depth, base_level, volume_texture);\n"
                  "\tif (tiled_size == 0 || levels == 0 || levels > 16 || depth == 0 || base_level >= levels ||\n"
                  "\t    regions.size() != expected_regions ||",
                  "tile expected regions",
                  re.S,
              )
              s = s.replace(
                  "for (uint32_t mip_level = 0; mip_level < levels; ++mip_level) {",
                  "for (uint32_t mip_level = base_level; mip_level < levels; ++mip_level) {",
                  1,
              )
              save(path, s)

          # TextureCache: omit nonresident mips during upload and add a BC7 fallback detector.
          path = "src/graphics/host_gpu/renderer/cache/textureCache.cpp"
          s = load(path)
          if "direction == TransferDirection::Upload ? info.resident_base_level" not in s:
              needle = "transfer.regions = TextureBuildImageCopies(transfer.layout);"
              if needle not in s:
                  raise RuntimeError("transfer.regions anchor not found")
              s = s.replace(
                  needle,
                  needle + """
          \tconst auto tile_base =
          \t    direction == TransferDirection::Upload ? info.resident_base_level : 0u;
          \tif (tile_base != 0) {
          \t\tstd::erase_if(transfer.regions, [tile_base](const vk::BufferImageCopy& region) {
          \t\t\treturn region.imageSubresource.mipLevel < tile_base;
          \t\t});
          \t}""",
                  1,
              )
              s = sub_once(
                  s,
                  r"TextureBuildGpuTileInfos\(info\.data\.size, transfer\.regions, transfer\.layout,\s*\n\s*info\.resources\.levels, transfer\.tiles\)",
                  "TextureBuildGpuTileInfos(info.data.size, transfer.regions, transfer.layout,\n"
                  "\t\t                              info.resources.levels, transfer.tiles, tile_base)",
                  "TextureBuildGpuTileInfos call",
                  re.S,
              )

          if "FindResidentBaseLevel" not in s:
              marker = "void TextureCache::InitializeImage(ImageId id) {"
              helper = r'''namespace {

          [[nodiscard]] uint32_t FindResidentBaseLevel(const ImageInfo& info) {
              constexpr uint32_t BlockBytes = 16;
              constexpr uint32_t MaxSamples = 2048;
              constexpr uint32_t UnwrittenPart = 8;
              if ((info.guest_format != Prospero::BufferFormat::kBc7UNorm &&
                   info.guest_format != Prospero::BufferFormat::kBc7Srgb) ||
                  info.resources.levels <= 1 || info.data.Empty()) {
                  return 0;
              }
              std::array<uint8_t, BlockBytes> block {};
              uint32_t base = 0;
              for (uint32_t level = 0; level + 1 < info.resources.levels; level++) {
                  const auto& mip = info.mip_layout[level];
                  if (mip.size < BlockBytes) {
                      break;
                  }
                  const auto blocks = static_cast<uint32_t>(mip.size / BlockBytes);
                  const auto step = std::max(1u, blocks / MaxSamples);
                  uint32_t seen = 0;
                  uint32_t empty = 0;
                  for (uint32_t i = 0; i < blocks; i += step) {
                      const auto at =
                          info.data.address + mip.offset + static_cast<uint64_t>(i) * BlockBytes;
                      if (!LibKernel::Memory::TryReadBacking(at, block.data(), 1)) {
                          break;
                      }
                      seen++;
                      if (block[0] == 0) {
                          empty++;
                      }
                  }
                  if (seen != 0 && empty * UnwrittenPart > seen) {
                      base = level + 1;
                  }
              }
              return base;
          }

          } // namespace

          '''
              if marker not in s:
                  raise RuntimeError("InitializeImage marker not found")
              s = s.replace(marker, helper + marker, 1)
              s = sub_once(
                  s,
                  r"(if \(image\.info\.samples > 1\) \{\s*\n\s*return;\s*\n\s*\}\s*\n)(\s*const bool upload)",
                  r"\1\tif (image.info.resident_base_level == 0) {\n"
                  r"\t\timage.info.resident_base_level = FindResidentBaseLevel(image.info);\n"
                  r"\t}\n\2",
                  "InitializeImage resident level",
                  re.S,
              )
              save(path, s)

          # Descriptor: MIN_LOD is the first strong residency hint, and the view must not expose
          # mips before it.
          path = "src/graphics/host_gpu/renderer/pipeline/descriptors.cpp"
          s = load(path)
          if "uint32_t resident_base)" not in s:
              s = sub_once(
                  s,
                  r"(static ImageViewInfo TextureViewInfo\(const ShaderRecompiler::IR::ImageResource& resource,\s*\n\s*const ShaderTextureResource& descriptor, vk::Format format,\s*\n\s*const SurfaceFormatInfo& surface_format, bool storage,\s*\n\s*uint32_t view_levels, uint32_t image_layers)\) \{",
                  r"\1, uint32_t resident_base) {",
                  "TextureViewInfo signature",
                  re.S,
              )
              s = sub_once(
                  s,
                  r"view\.format\s*= format;\s*\n\s*view\.aspect\s*= vk::ImageAspectFlagBits::eColor;\s*\n\s*view\.base_level\s*= descriptor\.BaseLevel\(\);\s*\n\s*view\.level_count\s*= view_levels;",
                  "view.format = format;\n"
                  "\tview.aspect = vk::ImageAspectFlagBits::eColor;\n"
                  "\tconst auto first_level = std::max<uint32_t>(descriptor.BaseLevel(), resident_base);\n"
                  "\tview.base_level = first_level;\n"
                  "\tview.level_count =\n"
                  "\t    view_levels > (first_level - descriptor.BaseLevel())\n"
                  "\t        ? view_levels - (first_level - descriptor.BaseLevel())\n"
                  "\t        : 1u;",
                  "TextureViewInfo levels",
                  re.S,
              )

          if "desc.info.resident_base_level" not in s:
              s = sub_once(
                  s,
                  r"(desc\.info\.extent\s*= \{width, height, volume \? depth : 1u\};\s*\n\s*desc\.info\.resources\s*= \{levels, image_layers\};\s*\n)",
                  r"\1\tdesc.info.resident_base_level =\n"
                  r"\t    multisampled ? 0u : std::min<uint32_t>(descriptor.MinLod() >> 8u, levels - 1u);\n",
                  "descriptor resident level",
                  re.S,
              )
              s = sub_once(
                  s,
                  r"TextureViewInfo\(resource, descriptor, view_format, surface_format, storage,\s*\n\s*view_levels, desc\.info\.resources\.layers\)",
                  "TextureViewInfo(resource, descriptor, view_format, surface_format, storage,\n"
                  "\t                                 view_levels, desc.info.resources.layers,\n"
                  "\t                                 desc.info.resident_base_level)",
                  "TextureViewInfo call",
                  re.S,
              )
              save(path, s)
          '@ | Set-Content -Encoding UTF8 .port_streamed_mips.py

          python .port_streamed_mips.py
          if ($LASTEXITCODE -ne 0) { throw "Failed to port streamed-mip fix" }
          Remove-Item .port_streamed_mips.py
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Streamed-mip port has whitespace errors" }

      - name: Apply batching and persistent Vulkan cache
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f"{label}: expected source text not found")
              return text.replace(old, new, 1)

          pm_path = "src/graphics/guest_gpu/command_processor/pm4Handlers.cpp"
          pm = read(pm_path)
          if "DeferInterruptOnlyReleaseMemFlushes" not in pm:
              pm = replace_once(pm, "#include <cstdio>\n#include <cstring>",
                                "#include <cstdio>\n#include <cstdlib>\n#include <cstring>", "#900 include")
              pm = replace_once(pm, "namespace {\n\nconstexpr uint32_t GcrGl2MetadataInvalidate",
          """namespace {

          bool DeferInterruptOnlyReleaseMemFlushes() {
              static const bool enabled = [] {
                  const auto* value = std::getenv("KYTY_DEFER_RELEASE_MEM_INTERRUPTS");
                  return value != nullptr && value[0] != '\\0' && std::strcmp(value, "0") != 0;
              }();
              return enabled;
          }

          constexpr uint32_t GcrGl2MetadataInvalidate""", "#900 helper")
              pm = replace_once(pm,
          """\t\t\tcase 0x01:
          \t\t\tcase 0x02:
          \t\t\tcase 0x04:
          \t\t\t\tcp.TriggerEopEventAtEndOfPipe(interrupt_context_id);
          \t\t\t\tcp.BufferFlush();
          \t\t\t\tbreak;""",
          """\t\t\tcase 0x01:
          \t\t\tcase 0x02:
          \t\t\tcase 0x04:
          \t\t\t\tcp.TriggerEopEventAtEndOfPipe(interrupt_context_id);
          \t\t\t\tif (!DeferInterruptOnlyReleaseMemFlushes()) {
          \t\t\t\t\tcp.BufferFlush();
          \t\t\t\t}
          \t\t\t\tbreak;""", "#900 RELEASE_MEM")
              write(pm_path, pm)

          pc_path = "src/graphics/host_gpu/renderer/pipeline/pipelineCache.cpp"
          pc = read(pc_path)
          if "KytyPC2:" not in pc:
              pc = pc.replace('#include "kytyGitVersion.h"\n', "", 1)
              pc = replace_once(pc,
                  "std::string DriverCacheSignature(const vk::PhysicalDeviceProperties& properties) {",
          """constexpr uint32_t kPipelineCacheFormat = 2;

          std::string DriverCacheSignature(const vk::PhysicalDeviceProperties& properties) {""", "#982 format")
              pc = replace_once(pc,
                  'return fmt::format("KytyPC1:{}:{:08x}:{:08x}:{:08x}:{}\\n", KYTY_GIT_REVISION,\n\t                   properties.vendorID, properties.deviceID, properties.driverVersion, uuid);',
                  'return fmt::format("KytyPC2:{}:{:08x}:{:08x}:{:08x}:{}\\n", kPipelineCacheFormat,\n\t                   properties.vendorID, properties.deviceID, properties.driverVersion, uuid);',
                  "#982 signature")
              old_gate = """\tconst std::string_view git_hash     = KYTY_GIT_HASH;
          \tconst std::string_view git_revision = KYTY_GIT_REVISION;
          \tif (git_hash == "unknown" || git_revision == "unknown") {
          \t\tPipelineCacheLog("Vulkan pipeline cache: disabled (unknown git revision)");
          \t\treturn;
          \t}
          \tif (git_hash.ends_with("-dirty")) {
          \t\tPipelineCacheLog("Vulkan pipeline cache: disabled (dirty build)");
          \t\treturn;
          \t}

          """
              pc = pc.replace(old_gate, "", 1)
              pc = pc.replace("Vulkan pipeline cache: invalidating {} (driver, emulator, or data mismatch)",
                              "Vulkan pipeline cache: invalidating {} (driver, format, or data mismatch)", 1)
              write(pc_path, pc)
          '@ | Set-Content -Encoding UTF8 .astrobot_v2_patch.py

          python .astrobot_v2_patch.py
          if ($LASTEXITCODE -ne 0) { throw "Failed to apply #900/#982 runtime ports" }
          Remove-Item .astrobot_v2_patch.py
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patch whitespace errors" }

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install glslang
        shell: pwsh
        run: |
          vcpkg install glslang[tools,opt]:x64-windows
          "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6.10.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build\windows -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON ^
            -DKYTY_BUILD_ORIGIN=Fork ^
            -DKYTY_BUILD_REPOSITORY=shemyaza00-pixel/KytyPS5 ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build emulator and launcher
        shell: cmd
        run: |
          cmake --build _Build\windows --target kyty_emulator launcher --parallel

      - name: Install emulator and launcher
        shell: cmd
        run: |
          cmake --install _Build\windows --prefix _Build\windows\install

      - name: Add Astro Bot patch and launchers
        shell: pwsh
        run: |
          $install = "_Build\windows\install"
          New-Item -ItemType Directory -Force -Path "$install\_Patches" | Out-Null
          @'
          {
            "id": "PPSA21564",
            "name": "ASTRO BOT: non RT patch",
            "version": "01.007.000",
            "process": "eboot.bin",
            "source_sha256": "70d673f7c43edb189461a60f076e15baa73f9a82a579603e44372ae5b7225d3d",
            "mods": [
              {
                "name": "Select the existing non-tiled deferred-lighting renderer",
                "enabled": true,
                "memory": [
                  {
                    "offset": "0x73eb993",
                    "off": "4584f60f84ed0800004531f64c8d3dea78a40141b430",
                    "on": "4584f6e9ee080000904531f64c8d3dea78a40141b430"
                  }
                ]
              },
              {
                "name": "Disable GI probes and lighting shaders",
                "enabled": true,
                "memory": [
                  {
                    "offset": "0x711d0b3",
                    "off": "0fb682800700008887e4050000",
                    "on": "b80000000090908887e4050000"
                  }
                ]
              }
            ]
          }
          '@ | Set-Content -Encoding UTF8 "$install\_Patches\PPSA21564.json"

          @'
          @echo off
          cd /d "%~dp0"
          set "KYTY_DEFER_RELEASE_MEM_INTERRUPTS=1"
          kyty_emulator.exe --game "C:\Games\PS5 Games\PPSA21564-app" --game-patch "%~dp0_Patches\PPSA21564.json" --redzone --shader-optimization-type Performance
          pause
          '@ | Set-Content -Encoding ASCII "$install\RUN_ASTROBOT_V2.bat"

          @'
          @echo off
          cd /d "%~dp0"
          set "KYTY_DEFER_RELEASE_MEM_INTERRUPTS=0"
          kyty_emulator.exe --game "C:\Games\PS5 Games\PPSA21564-app" --game-patch "%~dp0_Patches\PPSA21564.json" --redzone --shader-optimization-type Performance
          pause
          '@ | Set-Content -Encoding ASCII "$install\RUN_ASTROBOT_V2_NO_BATCHING.bat"

          @'
          @echo off
          cd /d "%~dp0"
          set "KYTY_DEFER_RELEASE_MEM_INTERRUPTS=1"
          start "" launcher.exe
          '@ | Set-Content -Encoding ASCII "$install\OPEN_LAUNCHER_V2.bat"

          @'
          Astro Bot Optimized V2 - PPSA21564 01.007.000

          Keeps the known-working #780 + #838 + compatible #839 + #985 stack.
          Adds official post-base audio timing/AvPlayer fixes (#822, #848, #966).
          #985 lineage includes #801 plus 64eea6b/684330c shader/render optimizations.
          Adds Astro streamed-mip residency and depth/colour target-size rendering fixes.
          Adds 8fa116e, 0bb2bda, 0ce84e5 and 96011cc performance optimizations.
          Keeps #900 interrupt-only RELEASE_MEM batching and #982 persistent Vulkan cache.
          The previous custom A/V frame-dropping experiment has been removed.

          Recommended: RUN_ASTROBOT_V2.bat
          Comparison without #900: RUN_ASTROBOT_V2_NO_BATCHING.bat
          GUI with #900 environment: OPEN_LAUNCHER_V2.bat
          '@ | Set-Content -Encoding UTF8 "$install\README-ASTROBOT-V2.txt"

      - name: Verify package
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "_Build\windows\install"
          if (!(Test-Path "_Build\windows\install\kyty_emulator.exe")) { throw "kyty_emulator.exe missing" }
          if (!(Test-Path "_Build\windows\install\launcher.exe")) { throw "launcher.exe missing" }

      - name: Upload V2 build
        uses: actions/upload-artifact@v4
        with:
          name: KytyPS5-AstroBot-Optimized-V2-Windows-x64
          path: _Build/windows/install/**
          if-no-files-found: error
